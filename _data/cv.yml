- title: Education
  type: time_table
  contents:
    - title: PhD
      institution: University of Queensland, Brisbane, Australia
      year: 2018-21
      description:
        - Recommended for Dean's Award for Outstanding Thesis
        - Studied thermal power generation from the techno-economics of existing and emerging technologies, to detailed thermodynamic analysis and thermo-fluid system modelling. 
        - Worked extensively with open-source (Python) system models, ranging from individual thermo-fluid processes to complete power plant off-design simulations. I also worked with advanced regression models for experimental data analysis. 

    - title: Bachelor of Engineerng (Mechanical)
      institution: University of Tasmania, Hobart, Australia
      year: 2011-14
      description:
        - First Class Honours
        - Dean's Roll of Excellence
        - President of the Student Engineering Society

- title: Experience
  type: time_table
  contents:
    - title: Research Fellow
      institution: University of Southern Queensland, Brisbane, Australia
      year: 2022 - Present 
      description:
        - Collaborating with leading aerospace and defence organisations, including NASA, Johns Hopkins Applied Physics Laboratory, US Air Force Research Laboratory, Northrop Grumman, Lockheed Martin, Varda Space Industries, and Southern Launch. Presented research at the Oxford Thermofluids Institute and multiple international conferences.
        - Led the development of advanced imaging and diagnostics systems for tracking re-entery capsules, satellites, and space debris. Designed and implemented portable precision tracking hardware and star-tracking software with state estimation algorithms, enabling high-fidelity trajectory reconstruction and break-up debris analysis.
        - Developed a novel framework for simultaneous hypersonic vehicle design and flight path optimisation ('co-design'), integrating efficient sensitivity propagation and automatic differentiation techniques to produce high-performance vehicle designs.
        - Developed open-source software for measuring aerodynamics in hypersonic wind tunnels, using high-speed stereo camera measurements and Bayesian state estimation.
    - title: Research Officer
      institution: University of Queensland, Brisbane, Australia
      year: 2021
      description:
        - Developed transient thermo-fluid models of a jet engine for an early-stag industry partner. These models will ultimately be used with advanced artificial intelligence for simulation and prediction of in-service machines.
    - title: Teaching Assistant
      institution: University of Queensland, Brisbane, Australia
      year: 2018 - 21
      description:
        - Energy Systems, Thermodynamics and Heat Transfer, Fluid Mechanics, Professional Engineering and the Business Environment, Engineering Innovation and Leadership, Climate Science and Policy.
    - title: Graduate Engineer
      institution: Tas Gas Networks / Enwave Australia
      year: 2016 - 18


